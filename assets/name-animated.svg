<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <style>
      .l { font: bold 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- A -->
  <text class="l" x="10" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    A
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="0s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="0.35s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- d -->
  <text class="l" x="56" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    d
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="0.25s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="0.6s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- i -->
  <text class="l" x="91" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    i
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="0.5s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="0.85s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- t -->
  <text class="l" x="109" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    t
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="0.75s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="1.1s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- y -->
  <text class="l" x="134" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    y
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="1s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="1.35s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- a -->
  <text class="l" x="169" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    a
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="1.25s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="1.6s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- M -->
  <text class="l" x="224" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    M
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="1.75s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.1s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- i -->
  <text class="l" x="276" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    i
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="2s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.35s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- t -->
  <text class="l" x="294" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    t
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="2.25s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.6s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- r -->
  <text class="l" x="319" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    r
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="2.5s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="2.85s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- a -->
  <text class="l" x="341" y="80" stroke="#3A56CC" stroke-width="1.5" fill="#4F6BED" fill-opacity="0"
        stroke-dasharray="300" stroke-dashoffset="300" stroke-linecap="round" stroke-linejoin="round">
    a
    <animate attributeName="stroke-dashoffset" from="300" to="0" begin="2.75s" dur="0.3s" fill="freeze"/>
    <animate attributeName="fill-opacity" from="0" to="1" begin="3.1s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- Reset: fade all to transparent after pause, then restart -->
  <set attributeName="fill-opacity" to="0" begin="7.5s"/>
  <set attributeName="stroke-dashoffset" to="300" begin="7.5s"/>
</svg>
